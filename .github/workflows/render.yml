name: render-frames
on:
  workflow_dispatch:
    inputs:
      range:
        description: 'Frame range, e.g. 0-399 (inclusive, rendered a-b per render.mjs)'
        required: true
      qual:
        description: 'JPEG quality'
        required: false
        default: '0.95'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - name: Render frames ${{ inputs.range }}
        run: HASH='#sc0.6667' WORKERS=1 node tools/render.mjs frames "${{ inputs.range }}" 1 "${{ inputs.qual }}"
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ inputs.range }}
          path: frames/
          retention-days: 3
